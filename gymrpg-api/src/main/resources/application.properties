# Datasource - PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=gymrpg
quarkus.datasource.password=gymrpg123
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/gymrpg_db

# Hibernate ORM
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true

# Porta HTTP (padrão já é 8080, deixamos explícito por clareza)
quarkus.http.port=8080

# CORS - permitir chamadas do Angular em desenvolvimento
quarkus.http.cors=true
quarkus.http.cors.origins=/http:\\/\\/localhost:4200/
quarkus.http.cors.headers=accept, authorization, content-type, x-requested-with
quarkus.http.cors.methods=GET, POST, PUT, DELETE, OPTIONS, HEAD
quarkus.http.cors.access-control-allow-credentials=true

# JWT - emissão de tokens (login)
mp.jwt.verify.issuer=gymrpg-api
smallrye.jwt.sign.key.location=privateKey.pem

# JWT - verificação de tokens (rotas protegidas)
mp.jwt.verify.publickey.location=publicKey.pem

# Tempo de expiração do token, em segundos (1 hora)
gymrpg.jwt.duration-seconds=3600